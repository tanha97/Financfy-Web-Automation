name: Playwright — Production (Docker)

on:
  workflow_dispatch:   # Manual trigger button in GitHub Actions

jobs:
  test:
    name: Run Playwright tests in Docker
    runs-on: ubuntu-latest

    steps:
      # Step 3.1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 3.2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3.3: Build Docker image
      - name: Build Docker image
        run: docker build -t playwright-production .

      # Step 3.4: Run tests inside Docker with secrets
      - name: Run Playwright tests in Docker
        run: |
          docker run --rm \
            -e ENV=staging \
            -e STAGING_URL=${{ secrets.PROD_URL }} \
            -e STAGING_MOBILE_NUMBER=${{ secrets.PROD_MOBILE_NUMBER }} \
            -e STAGING_PASSWORD=${{ secrets.PROD_PASSWORD }} \
            playwright-production npx playwright test

      # Step 3.5: Check Allure Results
      - name: Check Allure Results
        run: ls -la allure-results || echo "No allure-results found"

      # Step 3.6: Install Allure CLI
      - name: Install Allure CLI
        run: npm install -g allure-commandline
          
      # Step 3.7: Generate Allure Report
      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report || true

      # Step 3.8: Upload Playwright HTML report
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: playwright-report

      # Step 3.9: Upload Allure Report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-production
          path: allure-report

      # Step 3.10: Send email notification
      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Playwright CI (Docker) - ${{ job.status }}"
          to: "tanha.tahity@vivasoftltd.com , amirul.islam@vivasoftltd.com"
          from: "Financfy QA <${{ secrets.SMTP_USERNAME }}> "
          body: |
            Hello Team,

            The workflow has completed with status: ${{ job.status }}.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run Number: ${{ github.run_number }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
