name: Playwright - Staging

on:
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    name: Run tests against Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for Playwright tests
        run: docker build -t playwright-staging .

      - name: Run Playwright Tests inside Docker
        run: |
          docker run --rm \
            -e ENV=staging \
            -e STAGING_URL=${{ secrets.STAGING_URL }} \
            -e STAGING_MOBILE_NUMBER=${{ secrets.STAGING_MOBILE_NUMBER }} \
            -e STAGING_PASSWORD=${{ secrets.STAGING_PASSWORD }} \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            playwright-staging

      - name: Check Allure Results
        run: ls -la allure-results || echo "No results yet"

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p allure-results
          allure generate allure-results --clean -o allure-report || echo "⚠️ No allure results to generate"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-staging
          path: allure-report
          if-no-files-found: warn

  deploy-allure:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report-staging
          path: ./allure-report
        continue-on-error: true

      - name: Check if Allure Report exists
        id: check_allure
        run: |
          if [ ! -d "./allure-report" ] || [ -z "$(ls -A ./allure-report)" ]; then
            echo "no_report=true" >> $GITHUB_ENV
          else
            echo "no_report=false" >> $GITHUB_ENV
          fi

      - name: Deploy to GitHub Pages
        if: env.no_report == 'false'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: staging

      - name: Set Allure Report URL
        if: env.no_report == 'false'
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/} 
          echo "ALLURE_REPORT_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - name: Set email body
        run: |
          if [ "${{ env.no_report }}" == "false" ]; then
            echo "EMAIL_BODY<<EOF" >> $GITHUB_ENV
            echo "Hello Team,

The workflow has completed with status: ${{ job.status }}.

Repository: ${{ github.repository }}
Workflow: ${{ github.workflow }}
Run Number: ${{ github.run_number }}
🔗 Allure Report: ${{ env.ALLURE_REPORT_URL }}/" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "EMAIL_BODY<<EOF" >> $GITHUB_ENV
            echo "Hello Team,

The workflow has completed with status: ${{ job.status }}.

Repository: ${{ github.repository }}
Workflow: ${{ github.workflow }}
Run Number: ${{ github.run_number }}
⚠️ No Allure report was generated." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'Playwright CI - ${{ job.status }}'
          to: 'tanha.tahity@vivasoftltd.com , amirul.islam@vivasoftltd.com'
          from: 'Financfy QA <${{ secrets.SMTP_USERNAME }}>'
          body: ${{ env.EMAIL_BODY }}
